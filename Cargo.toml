[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/mecha-org/mxconfig"

[workspace.dependencies]
heck = "0.5"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "user"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
inotify = { version = "0.11", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

[workspace.lints.rust]
# Set by `flutter_rust_bridge_codegen` while it reads the FFI crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# `# Errors` and `# Panics` doc sections are optional.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[must_use]` on every getter adds noise without catching real mistakes.
must_use_candidate = "allow"
# Text templates read better as `+= &format!`, and none of them are hot.
format_push_string = "allow"
