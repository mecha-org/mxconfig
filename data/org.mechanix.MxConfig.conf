<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install to /usr/share/dbus-1/system.d/: root owns the name, anyone may call; polkit decides writes. -->
<busconfig>
  <policy user="root">
    <allow own="org.mechanix.MxConfig"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mechanix.MxConfig"/>
  </policy>
</busconfig>
